[project]
name = "recruitdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "mistralai>=3.2.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call the real Mistral API cost money: they run only with `-m mistral`.
# Browser tests need a built frontend and a browser: they run with `-m e2e`.
addopts = "-m 'not mistral and not e2e'"
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole run, so the database connection pool can be shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "mistral: calls the real Mistral API (costs money); run only on request",
    "e2e: browser tests with Playwright against a running server",
]

[tool.coverage.run]
source = ["app", "scripts"]
# SQLAlchemy's async engine runs on greenlets; without this, lines after an
# awaited database call are reported as not covered.
concurrency = ["greenlet", "thread"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and their secrets are fake on purpose.
"tests/**" = ["S101", "S105", "S106", "S107"]
# git is a fixed, trusted command here.
"scripts/check_tracked_files.py" = ["S603", "S607"]
# The database name comes from our own test configuration, not from user input.
"tests/integration/conftest.py" = ["S101", "S105", "S608"]
"tests/database.py" = ["S101", "S608"]
# Table and column names come from the database catalogue, not from user input.
"tests/integration/test_vacancy_review.py" = ["S101", "S608"]
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^web/"]
plugins = ["pydantic.mypy"]

# Installs `app` into the virtual environment, so scripts/ can import it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
