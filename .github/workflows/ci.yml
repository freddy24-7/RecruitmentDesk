name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recruitdesk
          POSTGRES_PASSWORD: recruitdesk
          POSTGRES_DB: recruitdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitdesk -d recruitdesk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # A throwaway database inside the CI job, not a secret.
      DATABASE_URL: postgresql+asyncpg://recruitdesk:recruitdesk@localhost:5432/recruitdesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: No access codes or secrets tracked by Git
        run: uv run python scripts/check_tracked_files.py
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests with coverage gate
        run: uv run pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types and build
        run: npm run build
      - name: Tests
        run: npm test
